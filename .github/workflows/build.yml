name: Build Hold To Attack

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric 1.21.11 (Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon clean build

      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: HoldToAttack-Fabric-1.21.11-Java21
          path: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*-dev.jar
          if-no-files-found: error
          retention-days: 30
